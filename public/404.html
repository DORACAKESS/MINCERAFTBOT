<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Lost in the Void | MineBot</title>
  <link rel="stylesheet" href="/css/tailwind.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%2334d399%22 stroke-width=%222%22><path d=%22M6 3h12l4 6.5L12 21 2 9.5 6 3z%22/><path d=%22M2 9.5h20M6 3l4 6.5L12 21M18 3l-4 6.5L12 21%22/></svg>" />
</head>
<body class="bg-[#070b12] text-slate-200 font-body antialiased min-h-screen overflow-hidden">

  <!-- Background decoration -->
  <div class="fixed inset-0 -z-10 pointer-events-none" aria-hidden="true">
    <div class="bg-grid absolute inset-0"></div>
    <div class="bg-glow absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] rounded-full"></div>
  </div>

  <!-- Floating blocks drifting up out of the void -->
  <div class="block-float" style="left:6%;  width:34px; height:34px; animation-duration:16s; animation-delay:0s;"></div>
  <div class="block-float" style="left:16%; width:52px; height:52px; animation-duration:22s; animation-delay:3s;"></div>
  <div class="block-float" style="left:28%; width:26px; height:26px; animation-duration:14s; animation-delay:1.5s;"></div>
  <div class="block-float" style="left:44%; width:44px; height:44px; animation-duration:19s; animation-delay:5s;"></div>
  <div class="block-float" style="left:58%; width:30px; height:30px; animation-duration:17s; animation-delay:2s;"></div>
  <div class="block-float" style="left:72%; width:58px; height:58px; animation-duration:24s; animation-delay:6s;"></div>
  <div class="block-float" style="left:84%; width:36px; height:36px; animation-duration:15s; animation-delay:4s;"></div>
  <div class="block-float" style="left:92%; width:24px; height:24px; animation-duration:20s; animation-delay:1s;"></div>

  <main class="min-h-screen flex items-center justify-center px-6">
    <div class="text-center animate-fade-up max-w-xl">
      <p class="font-pixel text-emerald-400/90 text-6xl md:text-8xl tracking-wider drop-shadow-[0_0_35px_rgba(52,211,153,0.35)]">404</p>
      <h1 class="mt-10 text-2xl md:text-3xl font-extrabold text-white tracking-tight">You fell out of the world!</h1>
      <p class="mt-4 text-sm md:text-base text-slate-400 leading-relaxed">
        This page doesn't exist — it has drifted into the void. Fear not, the way back to the surface is right here.
      </p>
      <div class="mt-10 flex flex-wrap items-center justify-center gap-4">
        <a href="/" class="btn btn-primary"><svg class="tb-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path stroke="none" d="M0 0h24v24H0z" fill="none" />
  <path d="M12 5l0 14" />
  <path d="M18 11l-6 -6" />
  <path d="M6 11l6 -6" /></svg> Back to Dashboard</a>
        <a href="/" class="btn btn-ghost">↻ Try Again</a>
      </div>
      <p class="mt-12 text-[11px] text-slate-600">MineBot Dashboard — Express · Socket.io · Tailwind</p>
    </div>
  </main>
</body>
</html>
