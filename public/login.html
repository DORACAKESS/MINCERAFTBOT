<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — MineBot</title>
  <link rel="stylesheet" href="/css/tailwind.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%2334d399%22 stroke-width=%222%22><path d=%22M6 3h12l4 6.5L12 21 2 9.5 6 3z%22/><path d=%22M2 9.5h20M6 3l4 6.5L12 21M18 3l-4 6.5L12 21%22/></svg>" />
  </head>
<body class="bg-[#070b12] text-slate-200 font-body antialiased min-h-screen">

  <!-- Background decoration -->
  <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none" aria-hidden="true">
    <div class="bg-grid absolute inset-0"></div>
    <div class="bg-glow absolute -top-40 -left-40 w-[600px] h-[600px] rounded-full"></div>
    <div class="bg-glow absolute -bottom-52 -right-40 w-[700px] h-[700px] rounded-full" style="animation-delay: 4s; animation-duration: 18s;"></div>
  </div>

  <main class="min-h-screen flex items-center justify-center px-6 py-12">
    <div class="w-full max-w-md animate-fade-up">

      <!-- Logo: voxel robot (login page only) -->
      <div class="flex justify-center mb-10 select-none">
        <svg viewBox="0 0 320 252" class="w-full max-w-[340px] h-auto overflow-visible" role="img" aria-label="MineBot — Minecraft Bot">
          <defs>
            <!-- Cobblestone-ish stone texture for the robot + title letters -->
            <pattern id="lb-stone" width="16" height="16" patternUnits="userSpaceOnUse">
              <rect width="16" height="16" fill="#2f2f2f"/>
              <rect x="1" y="1" width="7" height="6" fill="#8d8d8d"/>
              <rect x="9" y="1" width="6" height="6" fill="#979797"/>
              <rect x="1" y="8" width="6" height="7" fill="#a0a0a0"/>
              <rect x="8" y="8" width="7" height="7" fill="#868686"/>
              <rect x="3" y="2" width="1.5" height="1.5" fill="#b0b0b0"/>
              <rect x="11" y="10" width="1.5" height="1.5" fill="#6f6f6f"/>
              <rect x="4" y="12" width="1.5" height="1.5" fill="#a8a8a8"/>
              <rect x="2" y="9" width="1.5" height="1.5" fill="#767676"/>
            </pattern>
            <!-- Wooden texture for the antenna + pickaxe handles -->
            <pattern id="lb-wood" width="8" height="8" patternUnits="userSpaceOnUse">
              <rect width="8" height="8" fill="#7c4a24"/>
              <rect x="0" y="0" width="8" height="2" fill="#8f5828"/>
              <rect x="0" y="5" width="8" height="1" fill="#5f3817"/>
            </pattern>
            <!-- Glow for the eyes + red antenna lamp -->
            <filter id="lb-glow" x="-80%" y="-80%" width="260%" height="260%">
              <feGaussianBlur stdDeviation="2.4" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>

          <!-- Floating gears (slow spin) -->
          <g>
            <circle cx="95" cy="50" r="7" fill="none" stroke="#cbd5e1" stroke-width="3.4" stroke-dasharray="3.4 2.6"/>
            <circle cx="95" cy="50" r="2.6" fill="#cbd5e1"/>
            <animateTransform attributeName="transform" type="rotate" from="0 95 50" to="360 95 50" dur="7s" repeatCount="indefinite"/>
          </g>
          <g>
            <circle cx="225" cy="46" r="7" fill="none" stroke="#cbd5e1" stroke-width="3.4" stroke-dasharray="3.4 2.6"/>
            <circle cx="225" cy="46" r="2.6" fill="#cbd5e1"/>
            <animateTransform attributeName="transform" type="rotate" from="360 225 46" to="0 225 46" dur="5.5s" repeatCount="indefinite"/>
          </g>
          <g>
            <circle cx="88" cy="128" r="6" fill="none" stroke="#aab4c0" stroke-width="3" stroke-dasharray="3 2.2"/>
            <circle cx="88" cy="128" r="2.2" fill="#aab4c0"/>
            <animateTransform attributeName="transform" type="rotate" from="360 88 128" to="0 88 128" dur="6s" repeatCount="indefinite"/>
          </g>
          <g>
            <circle cx="232" cy="124" r="6" fill="none" stroke="#aab4c0" stroke-width="3" stroke-dasharray="3 2.2"/>
            <circle cx="232" cy="124" r="2.2" fill="#aab4c0"/>
            <animateTransform attributeName="transform" type="rotate" from="0 232 124" to="360 232 124" dur="8s" repeatCount="indefinite"/>
          </g>

          <!-- Red pixel sparks drifting around the head -->
          <g fill="#f87171">
            <rect x="112" y="26" width="3" height="3"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.4s" repeatCount="indefinite"/></rect>
            <rect x="128" y="14" width="3" height="3"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.9s" repeatCount="indefinite" begin="0.4s"/></rect>
            <rect x="146" y="8" width="3" height="3"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.6s" repeatCount="indefinite" begin="0.9s"/></rect>
            <rect x="170" y="12" width="3" height="3"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.2s" repeatCount="indefinite" begin="0.2s"/></rect>
            <rect x="196" y="22" width="3" height="3"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.5s" repeatCount="indefinite" begin="1.1s"/></rect>
            <rect x="216" y="36" width="3" height="3"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.8s" repeatCount="indefinite" begin="0.6s"/></rect>
            <rect x="228" y="62" width="3" height="3"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.3s" repeatCount="indefinite" begin="1.4s"/></rect>
            <rect x="106" y="96" width="3" height="3"><animate attributeName="opacity" values="0.15;1;0.15" dur="2s" repeatCount="indefinite" begin="0.7s"/></rect>
            <rect x="118" y="118" width="3" height="3"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.7s" repeatCount="indefinite" begin="0.1s"/></rect>
            <rect x="206" y="120" width="3" height="3"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.5s" repeatCount="indefinite" begin="1.2s"/></rect>
          </g>

          <!-- Robot (gentle idle bob) -->
          <g>
            <animateTransform attributeName="transform" type="translate" values="0 0; 0 -2.5; 0 0" dur="4s" repeatCount="indefinite"/>

            <!-- Antenna: wooden post + glowing red lamp -->
            <rect x="156" y="14" width="8" height="17" fill="url(#lb-wood)" stroke="#3a2410" stroke-width="1"/>
            <rect x="152" y="3" width="16" height="11" fill="#ef4444" filter="url(#lb-glow)" stroke="#7f1d1d" stroke-width="1">
              <animate attributeName="opacity" values="1;0.82;1" dur="2.6s" repeatCount="indefinite"/>
            </rect>
            <rect x="156" y="6" width="5" height="4" fill="#fca5a5" opacity="0.85"/>

            <!-- Ears: stacked stone blocks -->
            <g stroke="#222" stroke-width="1">
              <rect x="105" y="40" width="13" height="17" fill="url(#lb-stone)"/>
              <rect x="105" y="58" width="13" height="19" fill="url(#lb-stone)"/>
              <rect x="105" y="78" width="13" height="17" fill="url(#lb-stone)"/>
              <rect x="202" y="40" width="13" height="17" fill="url(#lb-stone)"/>
              <rect x="202" y="58" width="13" height="19" fill="url(#lb-stone)"/>
              <rect x="202" y="78" width="13" height="17" fill="url(#lb-stone)"/>
            </g>

            <!-- Head: cobblestone cube with lighting -->
            <rect x="120" y="30" width="80" height="100" fill="url(#lb-stone)" stroke="#1f1f1f" stroke-width="2"/>
            <rect x="122" y="32" width="76" height="7" fill="#ffffff" opacity="0.16"/>
            <rect x="122" y="120" width="76" height="8" fill="#000000" opacity="0.28"/>

            <!-- Corner bolts -->
            <g fill="#3f3f3f" stroke="#1b1b1b" stroke-width="0.8">
              <rect x="126" y="36" width="4.5" height="4.5"/>
              <rect x="189.5" y="36" width="4.5" height="4.5"/>
              <rect x="126" y="119" width="4.5" height="4.5"/>
              <rect x="189.5" y="119" width="4.5" height="4.5"/>
            </g>

            <!-- Glowing cyan eyes in dark sockets -->
            <rect x="130" y="52" width="24" height="24" fill="#191919" stroke="#000" stroke-width="1.5"/>
            <rect x="166" y="52" width="24" height="24" fill="#191919" stroke="#000" stroke-width="1.5"/>
            <rect x="136" y="58" width="13" height="13" fill="#22d3ee" filter="url(#lb-glow)"/>
            <rect x="171" y="58" width="13" height="13" fill="#22d3ee" filter="url(#lb-glow)"/>
            <rect x="139" y="61" width="4" height="4" fill="#d9fbff" opacity="0.85"/>
            <rect x="174" y="61" width="4" height="4" fill="#d9fbff" opacity="0.85"/>

            <!-- Mouth slit -->
            <rect x="140" y="100" width="40" height="5" fill="#191919" stroke="#000" stroke-width="1"/>
            <rect x="140" y="100" width="40" height="1.6" fill="#3a3a3a"/>
          </g>

          <!-- Title: stone-textured letters, golden-brown extrusion, dark outline -->
          <g font-family="'Press Start 2P', monospace" font-size="30" text-anchor="middle" letter-spacing="3">
            <text x="160" y="194" dy="9" fill="#2a1f0c" stroke="#0f0f0f" stroke-width="1.2">MINEBOT</text>
            <text x="160" y="194" dy="7" fill="#3d2f12" stroke="#0f0f0f" stroke-width="1.2">MINEBOT</text>
            <text x="160" y="194" dy="5" fill="#5c4719" stroke="#0f0f0f" stroke-width="1.2">MINEBOT</text>
            <text x="160" y="194" dy="3" fill="#8a6a24" stroke="#0f0f0f" stroke-width="1.2">MINEBOT</text>
            <text x="160" y="194" dy="1.5" fill="#a97f2c" stroke="#0f0f0f" stroke-width="1.2">MINEBOT</text>
            <text x="160" y="194" fill="url(#lb-stone)" stroke="#111" stroke-width="1.7" style="paint-order:stroke">MINEBOT</text>
          </g>

          <!-- Wooden pickaxes flanking the subtitle -->
          <g transform="translate(46 228) rotate(-28)">
            <rect x="-2.5" y="-2" width="5" height="20" fill="url(#lb-wood)" stroke="#3a2410" stroke-width="0.9"/>
            <path d="M-12 -4 L12 -4 L8 5 L-8 5 Z" fill="#9aa0a6" stroke="#3f4550" stroke-width="0.9"/>
            <path d="M-8 5 L-12 12 L-5 7 Z" fill="#9aa0a6" stroke="#3f4550" stroke-width="0.9"/>
            <path d="M8 5 L12 12 L5 7 Z" fill="#9aa0a6" stroke="#3f4550" stroke-width="0.9"/>
          </g>
          <g transform="translate(274 228) rotate(28) scale(-1 1)">
            <rect x="-2.5" y="-2" width="5" height="20" fill="url(#lb-wood)" stroke="#3a2410" stroke-width="0.9"/>
            <path d="M-12 -4 L12 -4 L8 5 L-8 5 Z" fill="#9aa0a6" stroke="#3f4550" stroke-width="0.9"/>
            <path d="M-8 5 L-12 12 L-5 7 Z" fill="#9aa0a6" stroke="#3f4550" stroke-width="0.9"/>
            <path d="M8 5 L12 12 L5 7 Z" fill="#9aa0a6" stroke="#3f4550" stroke-width="0.9"/>
          </g>

          <!-- Yellow/orange plus sparkles -->
          <g stroke="#fbbf24" stroke-width="1.7" stroke-linecap="round">
            <path d="M30 212 v9 M25.5 216.5 h9"/>
            <path d="M292 212 v9 M287.5 216.5 h9"/>
            <path d="M24 240 v7 M20.5 243.5 h7"/>
            <path d="M298 240 v7 M294.5 243.5 h7"/>
          </g>

          <!-- Subtitle: bright green blocky text with downward extrusion -->
          <g font-family="'Press Start 2P', monospace" font-size="13" text-anchor="middle" letter-spacing="2">
            <text x="160" y="238" dy="2" fill="#14532d" stroke="#0a0a0a" stroke-width="1.1">MINECRAFT BOT</text>
            <text x="160" y="238" fill="#4ade80" stroke="#0a0a0a" stroke-width="1.3" style="paint-order:stroke">MINECRAFT BOT</text>
          </g>
        </svg>
      </div>

      <!-- Login card -->
      <div class="card p-8">
        <h1 class="text-xl font-bold text-white tracking-tight">Sign in</h1>
        <p class="mt-1.5 text-sm text-slate-400">Enter your account credentials to open the dashboard.</p>

        <form id="login-form" class="mt-6 space-y-4" autocomplete="on">
          <div>
            <label for="login-username" class="label">Username</label>
            <div class="input-wrap">
              <span class="input-icon"><svg class="tb-ico"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
  class="icon icon-tabler icons-tabler-outline icon-tabler-user"
>
  <path stroke="none" d="M0 0h24v24H0z" fill="none" />
  <path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0" />
  <path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" />
</svg></span>
              <input id="login-username" class="input" placeholder="admin" required autocomplete="username" />
            </div>
          </div>
          <div>
            <label for="login-password" class="label">Password</label>
            <div class="input-wrap">
              <span class="input-icon"><svg class="tb-ico"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
  class="icon icon-tabler icons-tabler-outline icon-tabler-lock"
>
  <path stroke="none" d="M0 0h24v24H0z" fill="none" />
  <path d="M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-6" />
  <path d="M11 16a1 1 0 1 0 2 0a1 1 0 0 0 -2 0" />
  <path d="M8 11v-4a4 4 0 1 1 8 0v4" />
</svg></span>
              <input id="login-password" type="password" class="input" placeholder="••••••••" required autocomplete="current-password" />
            </div>
          </div>
          <p id="login-error" class="hidden text-sm text-red-400 bg-red-500/10 border border-red-500/25 rounded-lg px-3 py-2"></p>
          <button id="login-btn" type="submit" class="btn btn-primary w-full">Sign In</button>
        </form>

        <div class="mt-6 pt-6 border-t border-white/10">
          <button id="passkey-btn" type="button" class="btn btn-ghost w-full" title="Use a saved passkey (Windows Hello, Touch ID, fingerprint…)">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 11c0 3.5-1.5 6.5-3.5 8M8 9a4 4 0 118 0v2a5 5 0 01-5 5M12 17a4 4 0 00-2.5 1M15.5 13a4 4 0 003.5-2.5M18 8a4 4 0 00-1-2.5"/></svg>
            Sign in with passkey
          </button>
          <p id="passkey-note" class="hidden mt-3 text-xs text-slate-500 text-center leading-relaxed"></p>
        </div>
      </div>

      <p class="mt-6 text-center text-xs text-slate-600">MineBot Dashboard — Express · Socket.io · Tailwind</p>
    </div>
  </main>

  <script src="/js/icons.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
